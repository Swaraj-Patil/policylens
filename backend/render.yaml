# Render.com service definition for the PolicyLens backend.
#
# Deploy by connecting this repository in the Render dashboard. Render reads
# this file from the repo root of the linked branch.
#
# Required env vars (set in Render → Environment, NOT committed):
#   GROQ_API_KEY=<from console.groq.com/keys>
#   FRONTEND_ORIGIN=https://<your-frontend>.vercel.app
#
# Render's free web-service tier sleeps after inactivity. The first request
# after a sleep takes ~30s while the container cold-starts; subsequent
# requests are sub-second.

services:
  - type: web
    name: policylens-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama3-70b-8192
      - key: LLM_CACHE_ENABLED
        value: "false"
      # Secrets — fill in via the dashboard, not the YAML.
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
